<script data-mobile-pinch-zoom>
(() => {
  const plot = document.querySelector(".plotly-graph-div");
  if (!plot || !window.Plotly) return;

  let pinchDistance = 0;
  let pinchCamera = null;
  let pendingFrame = 0;
  let lastCamera = null;

  const clone = (value) => (value ? JSON.parse(JSON.stringify(value)) : null);
  const distance = (touches) => Math.hypot(
    touches[0].clientX - touches[1].clientX,
    touches[0].clientY - touches[1].clientY
  );
  const currentCamera = () => clone(
    lastCamera || plot.layout?.scene?.camera || plot._fullLayout?.scene?.camera
  );

  if (typeof plot.on === "function") {
    plot.on("plotly_relayout", (update) => {
      if (update["scene.camera"]) lastCamera = clone(update["scene.camera"]);
    });
  }

  plot.addEventListener("touchstart", (event) => {
    if (event.touches.length !== 2) return;
    pinchDistance = distance(event.touches);
    pinchCamera = currentCamera();
    event.preventDefault();
    event.stopImmediatePropagation();
  }, { passive: false, capture: true });

  plot.addEventListener("touchmove", (event) => {
    if (event.touches.length !== 2 || !pinchDistance || !pinchCamera?.eye) return;
    event.preventDefault();
    event.stopImmediatePropagation();

    const ratio = Math.max(0.35, Math.min(2.8, pinchDistance / distance(event.touches)));
    const camera = clone(pinchCamera);
    camera.eye = {
      x: pinchCamera.eye.x * ratio,
      y: pinchCamera.eye.y * ratio,
      z: pinchCamera.eye.z * ratio
    };

    cancelAnimationFrame(pendingFrame);
    pendingFrame = requestAnimationFrame(() => {
      Plotly.relayout(plot, { "scene.camera": camera });
    });
  }, { passive: false, capture: true });

  const endPinch = (event) => {
    if (!pinchDistance) return;
    if (event.touches.length < 2) {
      event.preventDefault();
      event.stopImmediatePropagation();
      pinchDistance = 0;
      pinchCamera = null;
    }
  };

  plot.addEventListener("touchend", endPinch, { passive: false, capture: true });
  plot.addEventListener("touchcancel", endPinch, { passive: false, capture: true });
})();
</script>
